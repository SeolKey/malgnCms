<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS API 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result.success {
            border-left-color: #28a745;
            background: #d4edda;
        }
        
        .result.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        
        .token-display {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            word-break: break-all;
            font-size: 12px;
        }
        
        .token-display strong {
            color: #667eea;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CMS API 테스트 페이지</h1>
        
        <!-- 인증 섹션 -->
        <div class="section">
            <h2>🔐 인증</h2>
            <div class="grid">
                <div>
                    <h3>로그인</h3>
                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" id="loginUsername" value="admin" placeholder="admin 또는 user1">
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="loginPassword" value="password">
                    </div>
                    <button onclick="login()">로그인</button>
                </div>
                
                <div>
                    <h3>회원가입</h3>
                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" id="signupUsername" placeholder="새 사용자명">
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="signupPassword" placeholder="비밀번호 (6자 이상)">
                    </div>
                    <button onclick="signup()">회원가입</button>
                </div>
            </div>
            
            <div id="tokenDisplay" class="token-display" style="display: none;">
                <strong>현재 토큰:</strong> <span id="tokenValue"></span>
            </div>
        </div>
        
        <!-- 콘텐츠 섹션 -->
        <div class="section">
            <h2>📝 콘텐츠 관리</h2>
            
            <div class="grid">
                <div>
                    <h3>콘텐츠 생성</h3>
                    <div class="form-group">
                        <label>제목:</label>
                        <input type="text" id="contentTitle" placeholder="콘텐츠 제목">
                    </div>
                    <div class="form-group">
                        <label>내용:</label>
                        <textarea id="contentDescription" placeholder="콘텐츠 내용"></textarea>
                    </div>
                    <button onclick="createContent()">생성</button>
                </div>
                
                <div>
                    <h3>콘텐츠 조회/수정/삭제</h3>
                    <div class="form-group">
                        <label>콘텐츠 ID:</label>
                        <input type="number" id="contentId" placeholder="콘텐츠 ID">
                    </div>
                    <button onclick="getContent()">조회</button>
                    <button onclick="getAllContents()" class="btn-success">전체 목록</button>
                    <br>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>수정할 제목:</label>
                        <input type="text" id="updateTitle" placeholder="수정할 제목">
                    </div>
                    <div class="form-group">
                        <label>수정할 내용:</label>
                        <textarea id="updateDescription" placeholder="수정할 내용"></textarea>
                    </div>
                    <button onclick="updateContent()">수정</button>
                    <button onclick="deleteContent()" class="btn-danger">삭제</button>
                </div>
            </div>
        </div>
        
        <!-- 결과 표시 -->
        <div class="section">
            <h2>📊 결과</h2>
            <div id="result" class="result">결과가 여기에 표시됩니다...</div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let currentToken = '';

        function showResult(data, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + (isError ? 'error' : 'success');
            resultDiv.textContent = JSON.stringify(data, null, 2);
        }

        function updateTokenDisplay() {
            const tokenDisplay = document.getElementById('tokenDisplay');
            const tokenValue = document.getElementById('tokenValue');
            if (currentToken) {
                tokenDisplay.style.display = 'block';
                tokenValue.textContent = currentToken;
            } else {
                tokenDisplay.style.display = 'none';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentToken = data.token;
                    updateTokenDisplay();
                    showResult({ message: '로그인 성공!', token: data.token });
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function signup() {
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;

            if (!username || !password) {
                showResult({ error: '사용자명과 비밀번호를 입력해주세요.' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult({ message: '회원가입 성공!', user: data });
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function createContent() {
            if (!currentToken) {
                showResult({ error: '먼저 로그인해주세요.' }, true);
                return;
            }

            const title = document.getElementById('contentTitle').value;
            const description = document.getElementById('contentDescription').value;

            if (!title) {
                showResult({ error: '제목을 입력해주세요.' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ title, description })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult({ message: '콘텐츠 생성 성공!', content: data });
                    document.getElementById('contentTitle').value = '';
                    document.getElementById('contentDescription').value = '';
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function getContent() {
            if (!currentToken) {
                showResult({ error: '먼저 로그인해주세요.' }, true);
                return;
            }

            const id = document.getElementById('contentId').value;
            if (!id) {
                showResult({ error: '콘텐츠 ID를 입력해주세요.' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents/${id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult({ message: '콘텐츠 조회 성공!', content: data });
                    document.getElementById('updateTitle').value = data.title;
                    document.getElementById('updateDescription').value = data.description || '';
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function getAllContents() {
            if (!currentToken) {
                showResult({ error: '먼저 로그인해주세요.' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents?page=0&size=10`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult({ message: '콘텐츠 목록 조회 성공!', contents: data });
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function updateContent() {
            if (!currentToken) {
                showResult({ error: '먼저 로그인해주세요.' }, true);
                return;
            }

            const id = document.getElementById('contentId').value;
            const title = document.getElementById('updateTitle').value;
            const description = document.getElementById('updateDescription').value;

            if (!id || !title) {
                showResult({ error: '콘텐츠 ID와 제목을 입력해주세요.' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ title, description })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult({ message: '콘텐츠 수정 성공!', content: data });
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        async function deleteContent() {
            if (!currentToken) {
                showResult({ error: '먼저 로그인해주세요.' }, true);
                return;
            }

            const id = document.getElementById('contentId').value;
            if (!id) {
                showResult({ error: '콘텐츠 ID를 입력해주세요.' }, true);
                return;
            }

            if (!confirm(`정말로 콘텐츠 ID ${id}를 삭제하시겠습니까?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (response.ok) {
                    showResult({ message: '콘텐츠 삭제 성공!' });
                    document.getElementById('contentId').value = '';
                    document.getElementById('updateTitle').value = '';
                    document.getElementById('updateDescription').value = '';
                } else {
                    const data = await response.json();
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }

        // 페이지 로드 시 초기화
        window.onload = function() {
            showResult({ message: 'CMS API 테스트 페이지가 준비되었습니다. 먼저 로그인해주세요.' });
        };
    </script>
</body>
</html>
