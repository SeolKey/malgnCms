<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .form-control:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 0.2rem rgba(31, 111, 235, 0.25);
        }
        .form-control.is-valid {
            border-color: #238636;
        }
        .form-control.is-invalid {
            border-color: #da3633;
        }
        .validation-feedback {
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card signup-card border-secondary">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill text-primary fs-1 mb-3"></i>
                            <h2 class="card-title mb-0">Create your account</h2>
                            <p class="text-muted mt-2">Join us today</p>
                        </div>
                        
                        <form id="signupForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control bg-dark border-secondary text-light" 
                                           id="username" placeholder="사용자명 (3-50자)" required minlength="3" maxlength="50">
                                    <button type="button" class="btn btn-primary" id="checkUsernameBtn" onclick="checkUsername()">
                                        <i class="bi bi-check-circle me-1"></i>Check
                                    </button>
                                </div>
                                <div id="usernameMessage" class="validation-feedback"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control bg-dark border-secondary text-light" 
                                           id="password" placeholder="비밀번호 (6자 이상)" required minlength="6">
                                </div>
                                <div id="passwordMessage" class="validation-feedback"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="passwordConfirm" class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control bg-dark border-secondary text-light" 
                                           id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                                </div>
                                <div id="passwordConfirmMessage" class="validation-feedback"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mb-3" id="submitBtn">
                                <i class="bi bi-person-check me-2"></i>Create account
                            </button>
                        </form>
                        
                        <div id="result" class="alert d-none" role="alert"></div>
                        
                        <hr class="my-4 border-secondary">
                        
                        <div class="text-center">
                            <a href="/api/auth/login" class="text-decoration-none me-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                            </a>
                            <span class="text-muted">·</span>
                            <a href="/api/contents" class="text-decoration-none ms-3">
                                <i class="bi bi-list-ul me-1"></i>Contents
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let usernameChecked = false;
        let usernameAvailable = false;

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const checkUsernameBtn = document.getElementById('checkUsernameBtn');
        const submitBtn = document.getElementById('submitBtn');
        const usernameMessage = document.getElementById('usernameMessage');
        const passwordMessage = document.getElementById('passwordMessage');
        const passwordConfirmMessage = document.getElementById('passwordConfirmMessage');

        async function checkUsername() {
            const username = usernameInput.value.trim();
            
            if (username.length < 3 || username.length > 50) {
                usernameInput.classList.add('is-invalid');
                usernameInput.classList.remove('is-valid');
                usernameMessage.className = 'validation-feedback text-danger';
                usernameMessage.textContent = '사용자명은 3-50자 사이여야 합니다.';
                usernameChecked = false;
                return;
            }

            checkUsernameBtn.disabled = true;
            checkUsernameBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Checking...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/check-username/${encodeURIComponent(username)}`);
                const data = await response.json();
                
                usernameChecked = true;
                
                if (data.exists) {
                    usernameInput.classList.add('is-invalid');
                    usernameInput.classList.remove('is-valid');
                    usernameMessage.className = 'validation-feedback text-danger';
                    usernameMessage.innerHTML = '<i class="bi bi-x-circle me-1"></i>이미 사용 중인 아이디입니다.';
                    usernameAvailable = false;
                } else {
                    usernameInput.classList.add('is-valid');
                    usernameInput.classList.remove('is-invalid');
                    usernameMessage.className = 'validation-feedback text-success';
                    usernameMessage.innerHTML = '<i class="bi bi-check-circle me-1"></i>사용 가능한 아이디입니다.';
                    usernameAvailable = true;
                }
            } catch (error) {
                usernameInput.classList.add('is-invalid');
                usernameMessage.className = 'validation-feedback text-danger';
                usernameMessage.textContent = '오류 발생: ' + error.message;
                usernameChecked = false;
            } finally {
                checkUsernameBtn.disabled = false;
                checkUsernameBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Check';
            }
        }

        usernameInput.addEventListener('input', function() {
            usernameChecked = false;
            usernameAvailable = false;
            usernameInput.classList.remove('is-valid', 'is-invalid');
            usernameMessage.textContent = '';
        });

        function validatePassword() {
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;

            if (password.length < 6) {
                passwordInput.classList.add('is-invalid');
                passwordInput.classList.remove('is-valid');
                passwordMessage.className = 'validation-feedback text-danger';
                passwordMessage.innerHTML = '<i class="bi bi-x-circle me-1"></i>비밀번호는 6자 이상이어야 합니다.';
                return false;
            } else {
                passwordInput.classList.add('is-valid');
                passwordInput.classList.remove('is-invalid');
                passwordMessage.className = 'validation-feedback text-success';
                passwordMessage.innerHTML = '<i class="bi bi-check-circle me-1"></i>사용 가능한 비밀번호입니다.';
            }

            if (passwordConfirm.length === 0) {
                passwordConfirmInput.classList.remove('is-valid', 'is-invalid');
                passwordConfirmMessage.textContent = '';
                return false;
            }

            if (password !== passwordConfirm) {
                passwordConfirmInput.classList.add('is-invalid');
                passwordConfirmInput.classList.remove('is-valid');
                passwordConfirmMessage.className = 'validation-feedback text-danger';
                passwordConfirmMessage.innerHTML = '<i class="bi bi-x-circle me-1"></i>비밀번호가 일치하지 않습니다.';
                return false;
            } else {
                passwordConfirmInput.classList.add('is-valid');
                passwordConfirmInput.classList.remove('is-invalid');
                passwordConfirmMessage.className = 'validation-feedback text-success';
                passwordConfirmMessage.innerHTML = '<i class="bi bi-check-circle me-1"></i>비밀번호가 일치합니다.';
                return true;
            }
        }

        passwordInput.addEventListener('input', validatePassword);
        passwordConfirmInput.addEventListener('input', validatePassword);

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const resultDiv = document.getElementById('result');

            if (!usernameChecked) {
                resultDiv.className = 'alert alert-warning';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>아이디 중복 확인을 해주세요.';
                resultDiv.classList.remove('d-none');
                return;
            }

            if (!usernameAvailable) {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>사용 가능한 아이디를 입력해주세요.';
                resultDiv.classList.remove('d-none');
                return;
            }

            if (!validatePassword()) {
                resultDiv.className = 'alert alert-warning';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>비밀번호를 확인해주세요.';
                resultDiv.classList.remove('d-none');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'alert alert-success';
                    resultDiv.innerHTML = '<i class="bi bi-check-circle me-2"></i>회원가입 성공! 로그인 페이지로 이동합니다.';
                    resultDiv.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/api/auth/login';
                    }, 1500);
                } else {
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>회원가입 실패: ' + (data.message || JSON.stringify(data));
                    resultDiv.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create account';
                }
            } catch (error) {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>오류 발생: ' + error.message;
                resultDiv.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create account';
            }
        });
    </script>
</body>
</html>
