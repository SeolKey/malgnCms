<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .form-control:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 0.2rem rgba(31, 111, 235, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card border-secondary">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill text-primary fs-1 mb-3"></i>
                            <h2 class="card-title mb-0">Sign in</h2>
                            <p class="text-muted mt-2">to your account</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control bg-dark border-secondary text-light" 
                                           id="username" value="admin" placeholder="admin 또는 user1" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control bg-dark border-secondary text-light" 
                                           id="password" value="password" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                            </button>
                        </form>
                        
                        <div id="result" class="alert d-none" role="alert"></div>
                        
                        <hr class="my-4 border-secondary">
                        
                        <div class="text-center">
                            <a href="/api/auth/signup" class="text-decoration-none me-3">
                                <i class="bi bi-person-plus me-1"></i>Create an account
                            </a>
                            <span class="text-muted">·</span>
                            <a href="/api/contents" class="text-decoration-none ms-3">
                                <i class="bi bi-list-ul me-1"></i>Contents
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', // 쿠키(세션) 포함
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    // 세션이 자동으로 생성됨 (쿠키에 저장)
                    resultDiv.className = 'alert alert-success';
                    resultDiv.innerHTML = `<i class="bi bi-check-circle me-2"></i>로그인 성공! 환영합니다, ${data.username}님.`;
                    resultDiv.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/api/contents';
                    }, 1500);
                } else {
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>로그인 실패: ' + (data.message || JSON.stringify(data));
                    resultDiv.classList.remove('d-none');
                }
            } catch (error) {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>오류 발생: ' + error.message;
                resultDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
