<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Detail - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
        }
        .content-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .content-body {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            white-space: pre-wrap;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/api/contents">
                <i class="bi bi-journal-text me-2"></i>맑은기술
            </a>
            <div class="d-flex gap-2">
                <a href="/api/contents" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Back to list
                </a>
                <button onclick="editContent()" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-pencil me-1"></i>Edit
                </button>
                <button onclick="deleteContent()" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card content-card border-secondary">
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    
                    <div id="contentDetail" style="display: none;">
                        <div class="card-header bg-dark border-secondary">
                            <h3 class="mb-0" id="contentTitle"></h3>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <small class="text-muted">
                                    <i class="bi bi-person me-1"></i><span id="contentAuthor"></span>
                                    <span class="mx-2">·</span>
                                    <i class="bi bi-eye me-1"></i><span id="contentViews"></span> views
                                    <span class="mx-2">·</span>
                                    <i class="bi bi-calendar me-1"></i><span id="contentDate"></span>
                                    <span id="contentModified" class="ms-2"></span>
                                </small>
                            </div>
                            <hr class="border-secondary">
                            <div class="content-body p-4" id="contentDescription"></div>
                        </div>
                    </div>
                    
                    <div id="result" class="alert d-none m-3" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let contentId = null;
        let contentData = null;

        // JWT 토큰에서 사용자 정보 추출
        function getUsernameFromToken() {
            const tokenInfo = getTokenInfo();
            return tokenInfo ? tokenInfo.username : null;
        }

        function getRoleFromToken() {
            const tokenInfo = getTokenInfo();
            return tokenInfo ? tokenInfo.role : null;
        }

        function getTokenInfo() {
            const token = localStorage.getItem('token');
            if (!token) return null;
            
            try {
                const parts = token.split('.');
                if (parts.length !== 3) return null;
                
                const payload = parts[1];
                const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                
                const decoded = JSON.parse(jsonPayload);
                return {
                    username: decoded.sub || decoded.subject || null,
                    role: decoded.role || null
                };
            } catch (error) {
                console.error('토큰 디코딩 실패:', error);
                return null;
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('로그인이 필요합니다.');
                window.location.href = '/api/auth/login';
                return false;
            }
            return true;
        }

        function getContentIdFromUrl() {
            const path = window.location.pathname;
            const match = path.match(/\/api\/contents\/(\d+)/);
            return match ? match[1] : null;
        }

        async function loadContent() {
            if (!checkAuth()) return;

            contentId = getContentIdFromUrl();
            if (!contentId) {
                document.getElementById('result').className = 'alert alert-danger';
                document.getElementById('result').innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>콘텐츠 ID가 없습니다.';
                document.getElementById('result').classList.remove('d-none');
                return;
            }

            const token = localStorage.getItem('token');
            const loadingDiv = document.getElementById('loading');
            const contentDetailDiv = document.getElementById('contentDetail');
            const resultDiv = document.getElementById('result');

            try {
                loadingDiv.style.display = 'block';
                contentDetailDiv.style.display = 'none';

                const response = await fetch(`${API_BASE_URL}/contents/${contentId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/auth/login';
                    return;
                }

                const data = await response.json();
                
                if (response.ok) {
                    contentData = data;
                    loadingDiv.style.display = 'none';
                    contentDetailDiv.style.display = 'block';
                    resultDiv.classList.add('d-none');
                    
                    document.getElementById('contentTitle').textContent = data.title;
                    document.getElementById('contentAuthor').textContent = data.createdBy;
                    document.getElementById('contentViews').textContent = data.viewCount;
                    document.getElementById('contentDate').textContent = new Date(data.createdDate).toLocaleString('ko-KR');
                    
                    const modifiedSpan = document.getElementById('contentModified');
                    if (data.lastModifiedDate) {
                        modifiedSpan.innerHTML = `<span class="mx-2">·</span><i class="bi bi-pencil me-1"></i>Updated ${new Date(data.lastModifiedDate).toLocaleString('ko-KR')}`;
                    } else {
                        modifiedSpan.innerHTML = '';
                    }
                    
                    document.getElementById('contentDescription').textContent = data.description || '(내용 없음)';
                    
                    // 작성자 본인이거나 ADMIN인지 확인하여 Edit/Delete 버튼 표시
                    const currentUsername = getUsernameFromToken();
                    const currentRole = getRoleFromToken();
                    const isAdmin = currentRole === 'ADMIN';
                    const isOwner = currentUsername && currentUsername === data.createdBy;
                    const canEditDelete = isOwner || isAdmin;
                    const editBtn = document.querySelector('button[onclick="editContent()"]');
                    const deleteBtn = document.querySelector('button[onclick="deleteContent()"]');
                    
                    if (editBtn) editBtn.style.display = canEditDelete ? 'inline-block' : 'none';
                    if (deleteBtn) deleteBtn.style.display = canEditDelete ? 'inline-block' : 'none';
                } else {
                    loadingDiv.style.display = 'none';
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>콘텐츠를 불러올 수 없습니다: ' + (data.message || JSON.stringify(data));
                    resultDiv.classList.remove('d-none');
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>오류 발생: ' + error.message;
                resultDiv.classList.remove('d-none');
            }
        }

        function editContent() {
            if (contentId) {
                window.location.href = `/api/contents/${contentId}/edit`;
            }
        }

        async function deleteContent() {
            if (!contentId) return;
            
            if (!confirm('정말로 이 콘텐츠를 삭제하시겠습니까?')) {
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_BASE_URL}/contents/${contentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('콘텐츠가 삭제되었습니다.');
                    window.location.href = '/api/contents';
                } else {
                    const data = await response.json();
                    alert('삭제 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('오류 발생: ' + error.message);
            }
        }

        window.onload = function() {
            loadContent();
        };
    </script>
</body>
</html>
