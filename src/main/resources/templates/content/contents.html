<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
        }
        .content-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .content-card:hover {
            border-color: #1f6feb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.15);
        }
        .content-card .card-body {
            padding: 1rem;
        }
        .content-card .card-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .content-card .card-text {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        .content-card .card-text.text-muted {
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .content-title-link {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
        }
        .content-title-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/api/contents">
                <i class="bi bi-journal-text me-2"></i>맑은기술
            </a>
            <div class="d-flex gap-2" id="navButtons">
                <button onclick="createContent()" class="btn btn-success btn-sm">
                    <i class="bi bi-plus-circle me-1"></i>New
                </button>
                <a href="/api/auth/login" class="btn btn-outline-primary btn-sm" id="signInBtn" style="display: none;">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                </a>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm" id="signOutBtn" style="display: none;">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign out
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-light">
                <i class="bi bi-list-ul me-2"></i>Contents
            </h2>
        </div>
        
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div id="contentList"></div>
        
        <div id="pagination" class="d-flex justify-content-center mt-4"></div>
        
        <div id="result" class="alert d-none mt-3" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let currentPage = 0;
        const pageSize = 10;
        let currentUsername = null;
        let currentRole = null;

        // 세션에서 사용자 정보 가져오기
        async function getCurrentUser() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    method: 'GET',
                    credentials: 'include' // 쿠키(세션) 포함
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUsername = data.username;
                    currentRole = data.role;
                    return { username: data.username, role: data.role };
                } else {
                    return null;
                }
            } catch (error) {
                console.error('사용자 정보 가져오기 실패:', error);
                return null;
            }
        }

        async function updateNavBar() {
            const userInfo = await getCurrentUser();
            const signInBtn = document.getElementById('signInBtn');
            const signOutBtn = document.getElementById('signOutBtn');
            
            if (userInfo) {
                signInBtn.style.display = 'none';
                signOutBtn.style.display = 'inline-block';
            } else {
                signInBtn.style.display = 'inline-block';
                signOutBtn.style.display = 'none';
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('로그아웃 오류:', error);
            }
            window.location.href = '/api/auth/login';
        }

        async function checkAuth() {
            const userInfo = await getCurrentUser();
            if (!userInfo) {
                document.getElementById('result').className = 'alert alert-warning';
                document.getElementById('result').innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>로그인이 필요합니다. 로그인 페이지로 이동합니다...';
                document.getElementById('result').classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = '/api/auth/login';
                }, 2000);
                return false;
            }
            return true;
        }

        async function loadContents(page = 0) {
            if (!(await checkAuth())) return;
            
            currentPage = page;
            const loadingDiv = document.getElementById('loading');
            const contentListDiv = document.getElementById('contentList');
            const resultDiv = document.getElementById('result');

            try {
                loadingDiv.style.display = 'block';
                contentListDiv.innerHTML = '';

                const response = await fetch(`${API_BASE_URL}/contents?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    credentials: 'include' // 쿠키(세션) 포함
                });

                if (response.status === 401) {
                    window.location.href = '/api/auth/login';
                    return;
                }

                const data = await response.json();
                
                if (response.ok) {
                    loadingDiv.style.display = 'none';
                    resultDiv.classList.add('d-none');
                    
                    if (data.content && data.content.length > 0) {
                        // 현재 사용자 정보 가져오기 (이미 getCurrentUser에서 설정됨)
                        const isAdmin = currentRole === 'ADMIN';
                        
                        contentListDiv.innerHTML = data.content.map(content => {
                            // 작성자 본인이거나 ADMIN인지 확인
                            const isOwner = currentUsername && currentUsername === content.createdBy;
                            const canEditDelete = isOwner || isAdmin;
                            const descriptionPreview = content.description 
                                ? (content.description.length > 100 
                                    ? content.description.substring(0, 100) + '...' 
                                    : content.description)
                                : '';
                            
                            return `
                            <div class="card content-card mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">
                                        <a href="#" onclick="viewContent(${content.id}); return false;" class="content-title-link">
                                            ${content.title}
                                        </a>
                                    </h5>
                                    <p class="card-text text-muted small mb-2">
                                        <i class="bi bi-person me-1"></i>${content.createdBy}
                                        <span class="mx-2">·</span>
                                        <i class="bi bi-eye me-1"></i>${content.viewCount} views
                                        <span class="mx-2">·</span>
                                        <i class="bi bi-calendar me-1"></i>${new Date(content.createdDate).toLocaleDateString('ko-KR')}
                                    </p>
                                    <p class="card-text">${descriptionPreview || '<span class="text-muted">(내용 없음)</span>'}</p>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <button onclick="viewContent(${content.id})" class="btn btn-outline-primary">
                                            <i class="bi bi-eye me-1"></i>View
                                        </button>
                                        ${canEditDelete ? `
                                        <button onclick="editContent(${content.id})" class="btn btn-outline-secondary">
                                            <i class="bi bi-pencil me-1"></i>Edit
                                        </button>
                                        <button onclick="deleteContent(${content.id})" class="btn btn-outline-danger">
                                            <i class="bi bi-trash me-1"></i>Delete
                                        </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                            `;
                        }).join('');
                        
                        const paginationDiv = document.getElementById('pagination');
                        paginationDiv.innerHTML = '';
                        
                        if (data.totalPages > 1) {
                            const pagination = document.createElement('nav');
                            const ul = document.createElement('ul');
                            ul.className = 'pagination';
                            
                            // Previous 버튼
                            const prevLi = document.createElement('li');
                            prevLi.className = `page-item ${data.number === 0 ? 'disabled' : ''}`;
                            prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadContents(${data.number - 1}); return false;">Previous</a>`;
                            ul.appendChild(prevLi);
                            
                            // 페이지 번호 버튼들
                            const currentPage = data.number;
                            const totalPages = data.totalPages;
                            let startPage = Math.max(0, currentPage - 2);
                            let endPage = Math.min(totalPages - 1, currentPage + 2);
                            
                            // 첫 페이지가 보이지 않으면 추가
                            if (startPage > 0) {
                                const firstLi = document.createElement('li');
                                firstLi.className = 'page-item';
                                firstLi.innerHTML = `<a class="page-link" href="#" onclick="loadContents(0); return false;">1</a>`;
                                ul.appendChild(firstLi);
                                
                                if (startPage > 1) {
                                    const ellipsisLi = document.createElement('li');
                                    ellipsisLi.className = 'page-item disabled';
                                    ellipsisLi.innerHTML = `<span class="page-link">...</span>`;
                                    ul.appendChild(ellipsisLi);
                                }
                            }
                            
                            // 페이지 번호들
                            for (let i = startPage; i <= endPage; i++) {
                                const pageLi = document.createElement('li');
                                pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
                                pageLi.innerHTML = `<a class="page-link" href="#" onclick="loadContents(${i}); return false;">${i + 1}</a>`;
                                ul.appendChild(pageLi);
                            }
                            
                            // 마지막 페이지가 보이지 않으면 추가
                            if (endPage < totalPages - 1) {
                                if (endPage < totalPages - 2) {
                                    const ellipsisLi = document.createElement('li');
                                    ellipsisLi.className = 'page-item disabled';
                                    ellipsisLi.innerHTML = `<span class="page-link">...</span>`;
                                    ul.appendChild(ellipsisLi);
                                }
                                
                                const lastLi = document.createElement('li');
                                lastLi.className = 'page-item';
                                lastLi.innerHTML = `<a class="page-link" href="#" onclick="loadContents(${totalPages - 1}); return false;">${totalPages}</a>`;
                                ul.appendChild(lastLi);
                            }
                            
                            // Next 버튼
                            const nextLi = document.createElement('li');
                            nextLi.className = `page-item ${data.number >= data.totalPages - 1 ? 'disabled' : ''}`;
                            nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadContents(${data.number + 1}); return false;">Next</a>`;
                            ul.appendChild(nextLi);
                            
                            pagination.appendChild(ul);
                            paginationDiv.appendChild(pagination);
                        }
                    } else {
                        contentListDiv.innerHTML = `
                            <div class="card content-card">
                                <div class="card-body text-center py-5">
                                    <i class="bi bi-inbox fs-1 text-muted mb-3"></i>
                                    <p class="text-muted">No contents found.</p>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    loadingDiv.style.display = 'none';
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>Error: ' + JSON.stringify(data);
                    resultDiv.classList.remove('d-none');
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>Error: ' + error.message;
                resultDiv.classList.remove('d-none');
            }
        }

        function createContent() {
            window.location.href = '/api/contents/new';
        }

        function viewContent(id) {
            window.location.href = `/api/contents/${id}`;
        }

        function editContent(id) {
            window.location.href = `/api/contents/${id}/edit`;
        }

        async function deleteContent(id) {
            if (!confirm('정말로 이 콘텐츠를 삭제하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents/${id}`, {
                    method: 'DELETE',
                    credentials: 'include' // 쿠키(세션) 포함
                });

                if (response.ok) {
                    loadContents(currentPage);
                } else {
                    const data = await response.json();
                    alert('삭제 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('오류 발생: ' + error.message);
            }
        }

        window.onload = async function() {
            await updateNavBar();
            await loadContents(0);
        };
    </script>
</body>
</html>
