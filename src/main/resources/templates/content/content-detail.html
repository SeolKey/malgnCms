<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Detail - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
        }
        .content-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .content-body {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            white-space: pre-wrap;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/api/contents">
                <i class="bi bi-journal-text me-2"></i>맑은기술
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card content-card border-secondary">
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    
                    <div id="contentDetail" style="display: none;">
                        <div class="card-header bg-dark border-secondary">
                            <h3 class="mb-0" id="contentTitle"></h3>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <small class="text-muted">
                                    <i class="bi bi-person me-1"></i><span id="contentAuthor"></span>
                                    <span class="mx-2">·</span>
                                    <i class="bi bi-eye me-1"></i><span id="contentViews"></span> views
                                    <span class="mx-2">·</span>
                                    <i class="bi bi-calendar me-1"></i><span id="contentDate"></span>
                                    <span id="contentModified" class="ms-2"></span>
                                </small>
                            </div>
                            <hr class="border-secondary">
                            <div class="content-body p-4" id="contentDescription"></div>
                            <div class="card-footer bg-dark border-secondary border-top">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a href="/api/contents" class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-arrow-left me-1"></i>목록으로
                                    </a>
                                    <button onclick="editContent()" class="btn btn-outline-primary btn-sm" id="editBtn" style="display: none;">
                                        <i class="bi bi-pencil me-1"></i>수정
                                    </button>
                                    <button onclick="deleteContent()" class="btn btn-outline-danger btn-sm" id="deleteBtn" style="display: none;">
                                        <i class="bi bi-trash me-1"></i>삭제
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="result" class="alert d-none m-3" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let contentId = null;
        let contentData = null;
        let currentUsername = null;
        let currentRole = null;

        // 세션에서 사용자 정보 가져오기
        async function getCurrentUser() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUsername = data.username;
                    currentRole = data.role;
                    return { username: data.username, role: data.role };
                } else {
                    return null;
                }
            } catch (error) {
                console.error('사용자 정보 가져오기 실패:', error);
                return null;
            }
        }

        function getContentIdFromUrl() {
            const path = window.location.pathname;
            const match = path.match(/\/api\/contents\/(\d+)/);
            return match ? match[1] : null;
        }

        async function loadContent() {
            // 사용자 정보 먼저 가져오기
            await getCurrentUser();
            
            contentId = getContentIdFromUrl();
            if (!contentId) {
                document.getElementById('result').className = 'alert alert-danger';
                document.getElementById('result').innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>콘텐츠 ID가 없습니다.';
                document.getElementById('result').classList.remove('d-none');
                return;
            }

            const loadingDiv = document.getElementById('loading');
            const contentDetailDiv = document.getElementById('contentDetail');
            const resultDiv = document.getElementById('result');

            try {
                loadingDiv.style.display = 'block';
                contentDetailDiv.style.display = 'none';

                const response = await fetch(`${API_BASE_URL}/contents/${contentId}`, {
                    method: 'GET',
                    credentials: 'include'
                });

                const data = await response.json();
                
                // 디버깅: 수정일 정보 확인
                console.log('Content Data 전체:', data);
                console.log('lastModifiedBy:', data.lastModifiedBy, 'lastModifiedDate:', data.lastModifiedDate);
                console.log('data.contents:', data.contents);
                
                if (response.ok) {
                    contentData = data;
                    loadingDiv.style.display = 'none';
                    contentDetailDiv.style.display = 'block';
                    resultDiv.classList.add('d-none');
                    
                    // ContentsBO의 구조에 따라 접근 경로 확인
                    // ContentsBO는 Contents 엔티티를 포함하고 getter 메서드가 있으므로
                    // 최상위 레벨에 필드가 있을 수 있음
                    const lastModifiedBy = data.lastModifiedBy || (data.contents && data.contents.lastModifiedBy);
                    const lastModifiedDate = data.lastModifiedDate || (data.contents && data.contents.lastModifiedDate);
                    
                    document.getElementById('contentTitle').textContent = data.title || (data.contents && data.contents.title);
                    document.getElementById('contentAuthor').textContent = data.createdBy || (data.contents && data.contents.createdBy);
                    document.getElementById('contentViews').textContent = data.viewCount || (data.contents && data.contents.viewCount) || 0;
                    const createdDate = data.createdDate || (data.contents && data.contents.createdDate);
                    document.getElementById('contentDate').textContent = new Date(createdDate).toLocaleString('ko-KR');
                    
                    const modifiedSpan = document.getElementById('contentModified');
                    // 수정일은 lastModifiedBy가 있을 때만 표시 (실제로 사용자가 수정한 경우만)
                    // 조회수 증가 등으로 인한 자동 업데이트는 제외
                    console.log('수정일 체크:', { lastModifiedBy, lastModifiedDate });
                    if (lastModifiedBy && lastModifiedDate) {
                        modifiedSpan.innerHTML = `<span class="mx-2">·</span><i class="bi bi-pencil me-1"></i>Updated ${new Date(lastModifiedDate).toLocaleString('ko-KR')}`;
                    } else {
                        modifiedSpan.innerHTML = '';
                    }
                    
                    const description = data.description || (data.contents && data.contents.description);
                    document.getElementById('contentDescription').textContent = description || '(내용 없음)';
                    
                    // 작성자 본인이거나 ADMIN인지 확인하여 Edit/Delete 버튼 표시
                    const createdBy = data.createdBy || (data.contents && data.contents.createdBy);
                    const isAdmin = currentRole === 'ADMIN';
                    const isOwner = currentUsername && currentUsername === createdBy;
                    const canEditDelete = isOwner || isAdmin;
                    const editBtn = document.getElementById('editBtn');
                    const deleteBtn = document.getElementById('deleteBtn');
                    
                    if (editBtn) editBtn.style.display = canEditDelete ? 'inline-block' : 'none';
                    if (deleteBtn) deleteBtn.style.display = canEditDelete ? 'inline-block' : 'none';
                } else {
                    loadingDiv.style.display = 'none';
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>콘텐츠를 불러올 수 없습니다: ' + (data.message || JSON.stringify(data));
                    resultDiv.classList.remove('d-none');
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>오류 발생: ' + error.message;
                resultDiv.classList.remove('d-none');
            }
        }

        function editContent() {
            if (!currentUsername) {
                alert('로그인이 필요합니다.');
                window.location.href = '/api/auth/login';
                return;
            }
            if (contentId) {
                window.location.href = `/api/contents/${contentId}/edit`;
            }
        }

        async function deleteContent() {
            if (!currentUsername) {
                alert('로그인이 필요합니다.');
                window.location.href = '/api/auth/login';
                return;
            }
            if (!contentId) return;
            
            if (!confirm('정말로 이 콘텐츠를 삭제하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents/${contentId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    alert('콘텐츠가 삭제되었습니다.');
                    window.location.href = '/api/contents';
                } else {
                    const data = await response.json();
                    alert('삭제 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('오류 발생: ' + error.message);
            }
        }

        window.onload = async function() {
            await loadContent();
        };
    </script>
</body>
</html>
