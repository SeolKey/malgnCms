<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 목록 - CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        button, .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .content-list {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .content-item {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .content-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .content-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .content-meta {
            color: #666;
            font-size: 0.9em;
        }
        
        .content-description {
            color: #555;
            margin-top: 10px;
            line-height: 1.6;
        }
        
        .content-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .pagination button {
            padding: 8px 16px;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 콘텐츠 목록</h1>
            <div class="actions">
                <button onclick="createContent()" class="btn-success">새 콘텐츠 작성</button>
                <a href="/api/auth/login" class="btn">로그인</a>
            </div>
        </div>
        
        <div class="content-list">
            <div id="loading">로딩 중...</div>
            <div id="contentList"></div>
            <div id="pagination" class="pagination"></div>
            <div id="result" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let currentPage = 0;
        const pageSize = 10;

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = '로그인이 필요합니다. 로그인 페이지로 이동합니다...';
                setTimeout(() => {
                    window.location.href = '/api/auth/login';
                }, 2000);
                return false;
            }
            return true;
        }

        async function loadContents(page = 0) {
            if (!checkAuth()) return;
            
            currentPage = page;
            const token = localStorage.getItem('token');
            const loadingDiv = document.getElementById('loading');
            const contentListDiv = document.getElementById('contentList');
            const resultDiv = document.getElementById('result');

            try {
                loadingDiv.style.display = 'block';
                contentListDiv.innerHTML = '';

                const response = await fetch(`${API_BASE_URL}/contents?page=${page}&size=${pageSize}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/auth/login';
                    return;
                }

                const data = await response.json();
                
                if (response.ok) {
                    loadingDiv.style.display = 'none';
                    resultDiv.style.display = 'none';
                    
                    if (data.content && data.content.length > 0) {
                        contentListDiv.innerHTML = data.content.map(content => `
                            <div class="content-item">
                                <div class="content-header">
                                    <div>
                                        <div class="content-title">${content.title}</div>
                                        <div class="content-meta">
                                            작성자: ${content.createdBy} | 
                                            조회수: ${content.viewCount} | 
                                            생성일: ${new Date(content.createdDate).toLocaleString('ko-KR')}
                                        </div>
                                    </div>
                                </div>
                                <div class="content-description">${content.description || '(내용 없음)'}</div>
                                <div class="content-actions">
                                    <button onclick="viewContent(${content.id})" class="btn-success">상세보기</button>
                                    <button onclick="editContent(${content.id})" class="btn">수정</button>
                                    <button onclick="deleteContent(${content.id})" class="btn-danger">삭제</button>
                                </div>
                            </div>
                        `).join('');
                        
                        // 페이징
                        const paginationDiv = document.getElementById('pagination');
                        paginationDiv.innerHTML = '';
                        
                        if (data.totalPages > 1) {
                            if (data.number > 0) {
                                const prevBtn = document.createElement('button');
                                prevBtn.textContent = '이전';
                                prevBtn.onclick = () => loadContents(data.number - 1);
                                paginationDiv.appendChild(prevBtn);
                            }
                            
                            const pageInfo = document.createElement('span');
                            pageInfo.textContent = `페이지 ${data.number + 1} / ${data.totalPages} (전체 ${data.totalElements}개)`;
                            pageInfo.style.padding = '8px 16px';
                            pageInfo.style.display = 'flex';
                            pageInfo.style.alignItems = 'center';
                            paginationDiv.appendChild(pageInfo);
                            
                            if (data.number < data.totalPages - 1) {
                                const nextBtn = document.createElement('button');
                                nextBtn.textContent = '다음';
                                nextBtn.onclick = () => loadContents(data.number + 1);
                                paginationDiv.appendChild(nextBtn);
                            }
                        }
                    } else {
                        contentListDiv.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">등록된 콘텐츠가 없습니다.</p>';
                    }
                } else {
                    loadingDiv.style.display = 'none';
                    resultDiv.style.display = 'block';
                    resultDiv.textContent = '오류: ' + JSON.stringify(data);
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.textContent = '오류 발생: ' + error.message;
            }
        }

        function createContent() {
            window.location.href = '/api/contents/new';
        }

        function viewContent(id) {
            window.location.href = `/api/contents/${id}`;
        }

        function editContent(id) {
            window.location.href = `/api/contents/${id}/edit`;
        }

        async function deleteContent(id) {
            if (!confirm('정말로 이 콘텐츠를 삭제하시겠습니까?')) {
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_BASE_URL}/contents/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    loadContents(currentPage);
                } else {
                    const data = await response.json();
                    alert('삭제 실패: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('오류 발생: ' + error.message);
            }
        }

        // 페이지 로드 시 콘텐츠 목록 불러오기
        window.onload = function() {
            loadContents(0);
        };
    </script>
</body>
</html>
