<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 작성 - CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 1.8em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .form-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 200px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            display: none;
        }
        
        .result.success {
            border-left-color: #28a745;
            background: #d4edda;
            display: block;
        }
        
        .result.error {
            border-left-color: #dc3545;
            background: #f8d7da;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✍️ 콘텐츠 작성</h1>
            <a href="/api/contents" class="btn">목록으로</a>
        </div>
        
        <div class="form-container">
            <form id="contentForm">
                <div class="form-group">
                    <label>제목 *</label>
                    <input type="text" id="title" placeholder="콘텐츠 제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea id="description" placeholder="콘텐츠 내용을 입력하세요"></textarea>
                </div>
                <button type="submit" class="btn-success">작성하기</button>
                <button type="button" onclick="window.location.href='/api/contents'">취소</button>
            </form>
            
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('로그인이 필요합니다.');
                window.location.href = '/api/auth/login';
                return false;
            }
            return true;
        }

        document.getElementById('contentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!checkAuth()) return;

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('result');

            if (!title.trim()) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '제목을 입력해주세요.';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/contents`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description })
                });

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/auth/login';
                    return;
                }

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '콘텐츠가 성공적으로 작성되었습니다! 목록 페이지로 이동합니다...';
                    setTimeout(() => {
                        window.location.href = '/api/contents';
                    }, 1500);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '작성 실패: ' + (data.message || JSON.stringify(data));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '오류 발생: ' + error.message;
            }
        });

        window.onload = function() {
            checkAuth();
        };
    </script>
</body>
</html>
