<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            display: none;
        }
        
        .result.success {
            border-left-color: #28a745;
            background: #d4edda;
            display: block;
        }
        
        .result.error {
            border-left-color: #dc3545;
            background: #f8d7da;
            display: block;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 회원가입</h1>
        <form id="signupForm">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="username" placeholder="사용자명 (3-50자)" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="비밀번호 (6자 이상)" required minlength="6">
            </div>
            <button type="submit">회원가입</button>
        </form>
        
        <div id="result" class="result"></div>
        
        <div class="links">
            <a href="/api/auth/login">로그인</a> |
            <a href="/api/contents">콘텐츠 목록</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            if (username.length < 3 || username.length > 50) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '사용자명은 3-50자 사이여야 합니다.';
                return;
            }

            if (password.length < 6) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '비밀번호는 6자 이상이어야 합니다.';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '회원가입 성공! 로그인 페이지로 이동합니다.';
                    setTimeout(() => {
                        window.location.href = '/api/auth/login';
                    }, 1500);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '회원가입 실패: ' + (data.message || JSON.stringify(data));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '오류 발생: ' + error.message;
            }
        });
    </script>
</body>
</html>
